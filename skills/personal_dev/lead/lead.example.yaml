# Copy this file to lead.local.yaml and edit that. lead.local.yaml is ignored
# by git and wins over this file (deep merge). Workers are defined HERE and
# only here — name them anything (a role, a specialty), give each a
# description of what it is good at, and the agent picks by description.
#
# Per-worker keys:
#   runner            codex | claude | cursor
#   model, reasoning_effort, timeout_ms
#   service_tier      codex only: e.g. `priority` (Fast: 1.5x speed, more usage). Session-wide,
#                     so the worker's spawned sub-agents inherit it.
#   kind              implement (default) | explore. explore runs read-only
#                     (codex sandbox / claude+cursor plan mode, inherited by
#                     sub-agents) and returns findings as its final message,
#                     which the script persists under _scratch/explorer/.
#   subagent          {model, reasoning_effort} for the sub-agents the worker
#                     spawns. A fast, low-cost model here is what
#                     makes fan-out affordable; the parent only decomposes and
#                     synthesizes. codex and claude pin model + effort;
#                     cursor rejects this block (count only). Without it the
#                     runner picks the sub-agent model itself.
#   subagents         default sub-agent count (0 = no fan-out). `--subagents N`
#                     on the command line overrides. Any runner.

workers:
  xhigh:
    description: Escalation only — use after high fails, or when the user explicitly requests maximum reasoning.
    runner: codex
    model: gpt-5.6-sol
    reasoning_effort: xhigh
    timeout_ms: 1800000
  high:
    description: Default for difficult work, including subtle bugs, architecture, gnarly debugging, and complex implementation.
    runner: codex
    model: gpt-5.6-sol
    reasoning_effort: high
    timeout_ms: 1500000
  medium:
    description: Bulk implementation with a clear spec. Pass --subagents N to parallelize independent slices (disjoint files).
    runner: codex
    model: gpt-5.6-sol
    reasoning_effort: medium
    timeout_ms: 1500000
  low:
    description: Targeted, near-deterministic edits from an exact spec.
    runner: codex
    model: gpt-5.6-sol
    reasoning_effort: low
    timeout_ms: 1500000
  frontend:
    description: Frontend and UI work.
    runner: claude
    model: claude-opus-5
    reasoning_effort: high
    timeout_ms: 1500000
  explore:
    description: Read-only exploration, codebase mapping, and question-answering; returns a findings file the next handoff can cite. Sub-agents do the reading, the orchestrator synthesizes.
    runner: codex
    model: gpt-5.6-sol
    reasoning_effort: medium
    service_tier: priority
    kind: explore
    subagent:
      model: gpt-5.6-luna
      reasoning_effort: xhigh
    subagents: 3
    timeout_ms: 900000
