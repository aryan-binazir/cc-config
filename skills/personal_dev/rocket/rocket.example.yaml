# Copy this file to rocket.local.yaml and edit the copy.
# The gitignored local file is used instead of this example when it exists.
# Rocket runs the `claude` plan profile unless invoked with `gpt`.
# Each profile's critic and reviewer come from the other provider.

defaults:
  review_profile: sol

plan_profiles:
  claude:
    # Git checkout mode: branch or worktree.
    checkout: worktree
    tracker: linear
    critic:
      name: Sol
      runner: codex
      model: gpt-6.1-sol
      reasoning_effort: xhigh
      timeout_ms: 1500000
    review_profile: sol

  gpt:
    # Git checkout mode: branch or worktree.
    checkout: worktree
    tracker: linear
    critic:
      name: Opus
      runner: claude
      model: claude-opus-5-5
      effort: xhigh
      timeout_ms: 1500000
    review_profile: opus

review_profiles:
  sol:
    slash_command: /code-review-ar
    summary_title: Rocket Review Summary
    diary_name: rocket_review
    reviewers:
      - name: Sol
        runner: codex
        model: gpt-6.1-sol
        reasoning_effort: xhigh
        timeout_ms: 2100000
        max_rounds: 3

  opus:
    slash_command: /code-review-ar
    summary_title: Rocket Review Summary
    diary_name: rocket_review
    reviewers:
      - name: Opus
        runner: claude
        model: claude-opus-5-5
        effort: xhigh
        timeout_ms: 2100000
        max_rounds: 3
