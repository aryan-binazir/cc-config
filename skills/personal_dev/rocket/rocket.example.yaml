# Copy this file to rocket.local.yaml on a machine that needs different defaults.
# rocket.local.yaml is ignored by git. Name plan profiles after their executor,
# such as `codex` or `claude`.

defaults:
  plan_profile: codex
  review_profile: standard

plan_profiles:
  codex:
    critic:
      name: Claude
      runner: claude
      model: opus
      effort: high
    review_profile: standard

  claude:
    critic:
      name: Codex
      runner: codex
      model: gpt-5.6-sol
      reasoning_effort: high
    review_profile: standard

review_profiles:
  standard:
    slash_command: /code-review
    summary_title: Rocket Review Summary
    diary_name: rocket_review
    reviewers:
      - name: Cursor
        runner: cursor
        model: cursor-grok-4.5-high-fast
        max_rounds: 2
      - name: Claude
        runner: claude
        model: opus
        effort: high
        max_rounds: 2
