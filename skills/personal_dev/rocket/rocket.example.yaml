# Copy this file to rocket.local.yaml and edit the copy.
# The gitignored local file is used instead of this example when it exists.
# Rocket runs the `claude` plan profile unless invoked with `gpt`.

defaults:
  review_profile: standard

plan_profiles:
  claude:
    # Git checkout mode: branch or worktree.
    checkout: worktree
    tracker: linear
    critic:
      name: Codex
      runner: codex
      model: gpt-6.1-sol
      reasoning_effort: xhigh
      timeout_ms: 1500000
    review:
      runner: rocket-review
    review_profile: standard

  gpt:
    # Git checkout mode: branch or worktree.
    checkout: worktree
    tracker: linear
    critic:
      name: Opus
      runner: claude
      model: claude-opus-5-5
      effort: high
      timeout_ms: 1500000
    review:
      runner: rocket-review
    review_profile: standard

review_profiles:
  standard:
    slash_command: /code-review-ar
    summary_title: Rocket Review Summary
    diary_name: rocket_review
    reviewers:
      - name: Opus
        runner: claude
        model: claude-opus-5-5
        effort: high
        timeout_ms: 2100000
        max_rounds: 1
      - name: Codex
        runner: codex
        model: gpt-6.1-sol
        reasoning_effort: xhigh
        timeout_ms: 2100000
        max_rounds: 1
