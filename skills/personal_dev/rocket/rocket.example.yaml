# Copy this file to rocket.local.yaml on a machine that needs different defaults.
# rocket.local.yaml is ignored by git. Name plan profiles after their executor,
# such as `codex` or `claude`.

defaults:
  plan_profile: codex
  review_profile: standard

plan_profiles:
  codex:
    # Git checkout mode: branch or worktree.
    checkout: worktree
    tracker: linear
    critic:
      name: Grok
      runner: cursor-agent
      model: grok-4.7-xhigh
      timeout_ms: 1500000
    grill:
      skill: grill-with-docs
    review:
      runner: rocket-review
    review_profile: standard

  claude:
    # Git checkout mode: branch or worktree.
    checkout: worktree
    tracker: linear
    critic:
      name: Codex
      runner: codex
      model: gpt-6-astra
      reasoning_effort: medium
      timeout_ms: 1500000
    grill:
      skill: grill-with-docs
    review:
      runner: rocket-review
    review_profile: standard

review_profiles:
  standard:
    slash_command: /code-review-ar
    summary_title: Rocket Review Summary
    diary_name: rocket_review
    reviewers:
      - name: Grok
        runner: cursor-agent
        model: grok-4.7-xhigh
        timeout_ms: 2100000
        max_rounds: 2
      - name: Codex
        runner: codex
        model: gpt-6-astra
        reasoning_effort: medium
        timeout_ms: 2100000
        max_rounds: 2
