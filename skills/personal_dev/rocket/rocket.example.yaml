# Copy this file to rocket.local.yaml on a machine that needs different defaults.
# rocket.local.yaml is ignored by git. Name plan profiles after their executor,
# such as `codex` or `claude`.

defaults:
  plan_profile: codex
  review_profile: standard

plan_profiles:
  codex:
    # Git checkout mode: branch or worktree.
    checkout: worktree
    tracker: linear
    critic:
      name: Claude
      runner: claude
      model: claude-opus-5
      effort: high
      timeout_ms: 1500000
    grill:
      skill: grill-with-docs
    review:
      runner: rocket-review
    review_profile: standard

  claude:
    # Git checkout mode: branch or worktree.
    checkout: worktree
    tracker: linear
    critic:
      name: Codex
      runner: codex
      model: gpt-5.6-sol
      reasoning_effort: high
      timeout_ms: 1500000
    grill:
      skill: grill-with-docs
    review:
      runner: rocket-review
    review_profile: standard

review_profiles:
  standard:
    slash_command: /code-review
    summary_title: Rocket Review Summary
    diary_name: rocket_review
    reviewers:
      - name: Claude
        runner: claude
        model: claude-opus-5
        effort: high
        timeout_ms: 2100000
        max_rounds: 2
      - name: Codex
        runner: codex
        model: gpt-5.6-sol
        reasoning_effort: high
        timeout_ms: 2100000
        max_rounds: 2
